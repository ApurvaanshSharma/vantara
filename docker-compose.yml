services:
  postgres:
    image: postgres:16-alpine
    container_name: vantara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vantara-net

  redis:
    image: redis:7-alpine
    container_name: vantara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vantara-net

  # OpenSearch's Docker entrypoint runs a security bootstrap step that is
  # separate from opensearch.yml settings. DISABLE_SECURITY_PLUGIN=true is the
  # documented way to skip it in Docker; OPENSEARCH_INITIAL_ADMIN_PASSWORD is
  # kept as a fallback so the bootstrap succeeds even if it still runs.
  # LOCAL DEV ONLY — never disable security like this outside a laptop environment.
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: vantara-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - vantara-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: vantara-dashboards
    restart: unless-stopped
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - vantara-net

  backend:
    build:
      context: ./backend
    image: vantara-backend:latest
    container_name: vantara-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      INGEST_API_KEY: ${INGEST_API_KEY}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app   # bind mount: local code edits reflect immediately via --reload, no rebuild needed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - vantara-net

  celery-worker:
    build:
      context: ./backend
    image: vantara-backend:latest
    container_name: vantara-celery-worker
    restart: unless-stopped
    # Same image as backend — same code, same dependencies — just a
    # different process. This is the standard pattern: one image, multiple
    # entrypoints, rather than maintaining two separate builds that could
    # drift out of sync with each other.
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      INGEST_API_KEY: ${INGEST_API_KEY}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - vantara-net

  frontend:
    build:
      context: ./frontend
      args:
        # localhost, NOT http://backend:8000 — this URL is baked into
        # JavaScript that runs in the USER'S BROWSER, outside the Docker
        # network entirely. "backend" only resolves *inside* that network
        # (that's what the backend/celery-worker services use to reach
        # Postgres/Redis/OpenSearch). The browser only knows about
        # whatever port is published to the host — localhost:8000, same
        # as every curl command in this project's own setup instructions.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: vantara-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vantara-net

volumes:
  postgres_data:
  redis_data:
  opensearch_data:

networks:
  vantara-net:
    driver: bridge
